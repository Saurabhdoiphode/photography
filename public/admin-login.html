<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Lens & Light</title>
  <style>
    :root { --ink:#17221f; --muted:#68736f; --paper:#f5f0e8; --card:#fffdf9; --green:#1f5147; --gold:#c58a42; --line:#ded7cb; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--ink); background:radial-gradient(circle at 12% 10%, #e8d7bd 0 16%, transparent 38%), linear-gradient(135deg,#f5f0e8 0%,#e5eee9 100%); font-family:Georgia, 'Times New Roman', serif; }
    .shell { width:min(100% - 32px, 1050px); min-height:650px; display:grid; grid-template-columns:1.05fr .95fr; overflow:hidden; background:var(--card); box-shadow:0 24px 70px #1f51471f; border:1px solid #ffffffaa; }
    .visual { position:relative; padding:48px; display:flex; flex-direction:column; justify-content:space-between; min-height:650px; color:#fff; background:linear-gradient(160deg,#173d36dd,#173d3680), url('https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=1100&q=85') center/cover; }
    .brand { font-size:15px; letter-spacing:3px; text-transform:uppercase; }
    .visual h1 { max-width:420px; margin:0; font-size:clamp(42px,5vw,72px); line-height:.94; font-weight:400; }
    .visual p { max-width:320px; margin:20px 0 0; color:#f2eee7cc; font:15px/1.6 Arial,sans-serif; }
    .form-side { display:flex; align-items:center; padding:clamp(32px,7vw,78px); }
    form { width:100%; max-width:360px; }
    .eyebrow { margin:0 0 14px; color:var(--gold); font:700 12px Arial,sans-serif; letter-spacing:2px; text-transform:uppercase; }
    h2 { margin:0 0 12px; font-size:42px; font-weight:400; }
    .intro { margin:0 0 34px; color:var(--muted); font:15px/1.5 Arial,sans-serif; }
    label { display:block; margin:18px 0 8px; font:700 12px Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; }
    input { width:100%; padding:15px 0; border:0; border-bottom:1px solid var(--line); outline:0; color:var(--ink); background:transparent; font:17px Georgia,serif; }
    input:focus { border-color:var(--green); }
    button { width:100%; margin-top:30px; padding:16px; border:0; color:#fff; background:var(--green); cursor:pointer; font:700 12px Arial,sans-serif; letter-spacing:1.5px; text-transform:uppercase; transition:background .2s, transform .2s; }
    button:hover { background:#163a33; transform:translateY(-1px); }
    .hint { margin-top:18px; color:var(--muted); font:12px Arial,sans-serif; }
    .error { min-height:18px; margin-top:14px; color:#a94438; font:13px Arial,sans-serif; }
    @media (max-width:700px) { .shell { grid-template-columns:1fr; } .visual { min-height:280px; padding:28px; } .visual h1 { font-size:48px; } .visual p { display:none; } .form-side { padding:42px 28px 52px; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="visual"><div class="brand">Lens & Light / Studio</div><div><h1>Make every frame count.</h1><p>A quiet workspace for managing your photography studio, clients and upcoming sessions.</p></div></section>
    <section class="form-side">
      <form id="loginForm">
        <p class="eyebrow">Private workspace</p><h2>Welcome back.</h2><p class="intro">Sign in to access your studio dashboard.</p>
        <label for="email">Email address</label><input id="email" type="email" placeholder="admin@lensandlight.com" autocomplete="username" required>
        <label for="password">Password</label><input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="submit">Enter dashboard</button><div class="error" id="error" role="alert"></div><p class="hint">Demo access: any valid email and password with 4+ characters.</p>
      </form>
    </section>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var error = document.getElementById('error');
      if (!email || password.length < 4) { error.textContent = 'Please enter a valid email and a password with 4+ characters.'; return; }
      sessionStorage.setItem('adminAuthenticated', 'true');
      sessionStorage.setItem('adminEmail', email);
      window.location.href = 'admin-dashboard.html';
    });
  </script>
</body>
</html>
