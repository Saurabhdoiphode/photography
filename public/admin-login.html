<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8TCG61273V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-8TCG61273V');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Omkar Doiphode Photography</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream-bg: #FDFBF7;
            --dark-charcoal: #1A1A1A;
            --soft-rose: #E5D0C5;
            --accent-gold: #D4A574;
        }

        body {
            background-color: var(--cream-bg);
            color: var(--dark-charcoal);
            font-family: 'Poppins', sans-serif;
        }

        .serif-heading {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            background: radial-gradient(circle at 50% 30%, rgba(212, 165, 116, 0.12) 0%, transparent 60%);
        }

        .login-box {
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.08);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(212, 165, 116, 0.4);
            border-top: 4px solid var(--accent-gold);
        }

        .od-monogram {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #0F172A;
            border: 2px solid var(--accent-gold);
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 20px;
            margin: 0 auto 1rem auto;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.15);
        }

        .login-title {
            text-align: center;
            margin-bottom: 0.3rem;
            font-size: 24px;
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            color: #0F172A;
        }

        .login-subtitle {
            text-align: center;
            color: #64748B;
            font-size: 13px;
            margin-bottom: 1.8rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 1.4rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #0F172A;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #CBD5E1;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
            background: #FFFFFF;
            color: #0F172A;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #0F172A;
            color: var(--accent-gold);
            border: 1.5px solid var(--accent-gold);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.15);
        }

        .login-btn:hover {
            background: var(--accent-gold);
            color: #0F172A;
            transform: translateY(-2px);
        }

        .error-message {
            color: #B91C1C;
            text-align: center;
            margin-bottom: 1.2rem;
            font-size: 13px;
            padding: 10px 14px;
            background-color: #FEE2E2;
            border: 1px solid #FCA5A5;
            border-radius: 8px;
            display: none;
            font-weight: 600;
        }

        .success-message {
            color: #15803D;
            text-align: center;
            margin-bottom: 1.2rem;
            font-size: 13px;
            padding: 10px 14px;
            background-color: #DCFCE7;
            border: 1px solid #86EFAC;
            border-radius: 8px;
            display: none;
            font-weight: 600;
        }

        .loading {
            display: none;
            text-align: center;
        }

        .spinner {
            border: 3px solid #F1F5F9;
            border-top: 3px solid var(--accent-gold);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 1.8rem 1.2rem;
                border-radius: 14px;
            }
            .login-title {
                font-size: 21px;
            }
        }
        .lang-toggle-btn {
            background: #0F172A !important;
            color: #F59E0B !important;
            border: 1.5px solid #F59E0B !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2) !important;
        }
        .lang-toggle-btn span, #langBtnText {
            color: #F59E0B !important;
            font-weight: 800 !important;
        }
    </style>
</head>
<body>
    <div style="position: absolute; top: 16px; right: 20px; display: flex; align-items: center; gap: 10px; z-index: 10;">
        <a href="/" style="background: rgba(15, 23, 42, 0.08); color: #0F172A; text-decoration: none; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; transition: all 0.3s ease;" data-i18n="al_back">
            🏠 Back to Main Website
        </a>
        <button class="lang-toggle-btn" onclick="toggleLanguage()" style="background: #0F172A; color: #F59E0B !important; border: 1.5px solid #F59E0B; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 800; cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
            <span id="langBtnText" style="color: #F59E0B !important; font-weight: 800;">🌐 मराठी</span>
        </button>
    </div>

    <div class="login-container">
        <div class="login-box">
            <div class="od-monogram">OD</div>
            <h1 class="login-title" data-i18n="al_title">Omkar Doiphode Photography</h1>
            <p class="login-subtitle" data-i18n="al_subtitle">Admin Control Center Portal</p>
            
            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username" data-i18n="al_user_label">Phone / Username</label>
                    <input type="text" id="username" name="username" required data-i18n-ph="al_user_ph" placeholder="Enter username / 9146929608">
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="al_pass_label">Password</label>
                    <input type="password" id="password" name="password" required data-i18n-ph="al_pass_ph" placeholder="Enter your admin password">
                </div>

                <button type="submit" class="login-btn" id="submitBtn" data-i18n="al_btn_login">Access Admin Panel →</button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 1rem; font-size: 13px; font-weight: 600; color: #475569;" data-i18n="al_loading">Verifying credentials...</p>
            </div>
        </div>
    </div>

    <script>
        const i18nDict = {
            en: {
                al_title: "Omkar Doiphode Photography",
                al_subtitle: "Admin Control Center Portal",
                al_user_label: "Phone / Username",
                al_user_ph: "Enter username / 9146929608",
                al_pass_label: "Password",
                al_pass_ph: "Enter your admin password",
                al_btn_login: "Access Admin Panel →",
                al_loading: "Verifying credentials...",
                al_success: "Login successful! Redirecting...",
                al_back: "🏠 Back to Main Website"
            },
            mr: {
                al_title: "ओमकार डोईफोडे फोटोग्राफी",
                al_subtitle: "ॲडमीन कंट्रोल सेंटर पोर्टल",
                al_user_label: "फोन नंबर / युझरनेम",
                al_user_ph: "युझरनेम किंवा ९१४६९२९६०८ टाका",
                al_pass_label: "पासवर्ड",
                al_pass_ph: "तुमचा ॲडमीन पासवर्ड टाका",
                al_btn_login: "ॲडमीन पॅनल उघडा →",
                al_loading: "माहिती तपासत आहे...",
                al_success: "लॉगिन यशस्वी! रीडायरेक्ट होत आहे...",
                al_back: "🏠 मुख्य वेबसाईटवर जा"
            }
        };

        let currentLang = localStorage.getItem('selectedLang') || 'en';

        function toggleLanguage() {
            currentLang = (currentLang === 'en') ? 'mr' : 'en';
            localStorage.setItem('selectedLang', currentLang);
            applyLanguage(currentLang);
        }

        function applyLanguage(lang) {
            const dict = i18nDict[lang] || i18nDict['en'];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) {
                    el.innerHTML = dict[key];
                }
            });

            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (dict[key]) {
                    el.placeholder = dict[key];
                }
            });

            const btnText = lang === 'en' ? '🌐 मराठी' : '🌐 English';
            const b = document.getElementById('langBtnText');
            if (b) b.textContent = btnText;
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'selectedLang' && e.newValue) {
                currentLang = e.newValue;
                applyLanguage(currentLang);
            }
        });

        window.addEventListener('pageshow', () => {
            currentLang = localStorage.getItem('selectedLang') || 'en';
            applyLanguage(currentLang);
        });

        document.addEventListener('DOMContentLoaded', () => {
            applyLanguage(currentLang);
        });

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const loading = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const dict = i18nDict[currentLang] || i18nDict['en'];

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            submitBtn.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('adminToken', data.token);
                    successMsg.textContent = dict.al_success;
                    successMsg.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = '/admin-dashboard.html';
                    }, 1500);
                } else {
                    throw new Error(data.error || 'Login failed');
                }
            } catch (error) {
                let msg = error.message || 'Login failed';
                if (currentLang === 'mr') {
                    if (msg.includes('Invalid credentials')) msg = 'चुकीचे युझरनेम किंवा पासवर्ड.';
                    else if (msg.includes('Username and password required')) msg = 'युझरनेम आणि पासवर्ड दोन्ही आवश्यक आहेत.';
                    else if (msg.includes('Login failed')) msg = 'लॉगिन अयशस्वी. कृपया युझरनेम व पासवर्ड तपासा.';
                    else if (msg.includes('Failed to fetch')) msg = 'सर्व्हरशी संपर्क होऊ शकला नाही. इंटरनेट कनेक्शन तपासा.';
                }
                errorMsg.textContent = msg;
                errorMsg.style.display = 'block';
                submitBtn.style.display = 'block';
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
